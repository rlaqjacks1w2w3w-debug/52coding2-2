<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Strike: Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; overflow: hidden; background: #020005; font-family: 'Orbitron', sans-serif; }
        canvas { display: block; }
        
        .neon-border {
            border: 2px solid #0ff;
            box-shadow: 0 0 15px #0ff, inset 0 0 15px #0ff;
        }
        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
        }
        .critical-text {
            color: #f0f;
            text-shadow: 0 0 5px #fff, 0 0 10px #f0f, 0 0 20px #f0f;
        }
        .damage-flash {
            position: absolute; inset: 0; background: radial-gradient(circle, transparent 30%, rgba(255, 0, 100, 0.4) 100%);
            pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 50;
            filter: contrast(150%) brightness(120%);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; pointer-events: none; z-index: 100;
            transition: all 0.2s;
        }
        #crosshair.reloading {
            opacity: 0.3;
            transform: translate(-50%, -50%) rotate(45deg) scale(0.8);
        }
        #crosshair svg { filter: drop-shadow(0 0 5px #0ff); }
    </style>
</head>
<body>

    <div id="damage-overlay" class="damage-flash"></div>
    
    <div id="crosshair">
        <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="none" stroke="#0ff" stroke-width="2" stroke-dasharray="20 10" />
            <circle cx="50" cy="50" r="2" fill="#0ff" />
            <path id="crosshair-lines" d="M50 10 L50 25 M90 50 L75 50 M50 90 L50 75 M10 50 L25 50" stroke="#0ff" stroke-width="3" />
        </svg>
    </div>

    <div id="ui" class="absolute inset-0 flex flex-col justify-between p-8 pointer-events-none z-10">
        <div class="flex justify-between items-start">
            <div class="bg-black/40 backdrop-blur-md p-6 rounded-2xl border-l-4 border-cyan-400">
                <div class="text-[10px] uppercase tracking-[0.4em] text-cyan-300 opacity-70">Data Synchronized</div>
                <div class="flex items-baseline gap-2">
                    <span class="text-xs text-cyan-400">SCORE:</span>
                    <span id="score" class="text-5xl font-black neon-text leading-none">00000</span>
                </div>
            </div>
            
            <div class="bg-black/40 backdrop-blur-md p-6 rounded-2xl border-r-4 border-magenta-500 text-right">
                <div class="text-[10px] uppercase tracking-[0.4em] text-pink-400 opacity-70">Core Stability</div>
                <div id="health-bar-container" class="w-48 h-2 bg-gray-800 mt-2 rounded-full overflow-hidden">
                    <div id="health-bar" class="h-full bg-gradient-to-r from-pink-500 to-purple-600 transition-all duration-300" style="width: 100%"></div>
                </div>
                <div id="health-text" class="text-2xl font-bold critical-text mt-1">100%</div>
            </div>
        </div>

        <div class="flex justify-center mb-10">
             <div class="bg-black/60 backdrop-blur-lg px-8 py-4 rounded-full border border-white/10 flex flex-col items-center">
                 <div id="ammo-status" class="text-cyan-400 text-[10px] tracking-[0.5em] mb-2 font-bold uppercase">Ammo Nominal</div>
                 <div class="flex gap-1" id="ammo-pips">
                     <!-- Ammo pips will be generated here -->
                 </div>
                 <div id="ammo-count" class="text-white font-black text-xl mt-1">20 / 20</div>
             </div>
        </div>

        <div id="overlay" class="absolute inset-0 flex items-center justify-center bg-[#050010]/90 pointer-events-auto cursor-pointer">
            <div class="text-center p-12 rounded-3xl border border-cyan-500/20 bg-gradient-to-b from-cyan-500/5 to-transparent">
                <h1 class="text-7xl font-black mb-2 italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-pink-400">NEON STRIKE</h1>
                <div class="h-1 w-full bg-gradient-to-r from-transparent via-cyan-500 to-transparent mb-6"></div>
                <p id="message" class="text-xl animate-pulse text-cyan-300 tracking-widest font-light">SYSTEM READY. CLICK TO INITIALIZE.</p>
                <div class="mt-12 grid grid-cols-2 gap-4 text-[10px] uppercase tracking-[0.3em] text-gray-500">
                    <div class="border border-white/10 p-3 rounded-lg">WASD <br> Movement</div>
                    <div class="border border-white/10 p-3 rounded-lg">MOUSE <br> Combat Fire (20 Rounds)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let score = 0;
        let health = 100;
        let gameActive = false;
        
        // Ammo System
        const MAX_AMMO = 20;
        let currentAmmo = 20;
        let isReloading = false;
        const RELOAD_TIME = 1000; // 1 second reload

        let lastEnemySpawn = 0;
        let shakeIntensity = 0;
        let lastLockTime = 0;
        const LOCK_COOLDOWN = 1300; 
        const enemies = [];
        const bullets = []; 
        const particles = [];
        const moveState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let pitch = 0, yaw = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020005);
            scene.fog = new THREE.FogExp2(0x020005, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambient);

            const mainLight = new THREE.PointLight(0x00ffff, 2, 100);
            mainLight.position.set(0, 10, 0);
            scene.add(mainLight);

            // Stars
            const starGeo = new THREE.BufferGeometry();
            const starCoords = [];
            for(let i=0; i<3000; i++) {
                starCoords.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // Grid
            const grid = new THREE.GridHelper(300, 80, 0xff00ff, 0x003333);
            grid.position.y = -0.01;
            scene.add(grid);

            const floorGeo = new THREE.PlaneGeometry(500, 500);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x050005, roughness: 0.1, metalness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createAmmoPips();
            setupControls();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createAmmoPips() {
            const container = document.getElementById('ammo-pips');
            container.innerHTML = '';
            for (let i = 0; i < MAX_AMMO; i++) {
                const pip = document.createElement('div');
                pip.className = 'w-1 h-4 bg-cyan-400 rounded-sm transition-all duration-200';
                pip.id = `ammo-pip-${i}`;
                container.appendChild(pip);
            }
        }

        function updateAmmoUI() {
            const statusText = document.getElementById('ammo-status');
            const countText = document.getElementById('ammo-count');
            const crosshair = document.getElementById('crosshair');
            const crosshairLines = document.getElementById('crosshair-lines');

            if (isReloading) {
                statusText.innerText = 'System Reloading...';
                statusText.classList.add('text-pink-500');
                statusText.classList.remove('text-cyan-400');
                countText.innerText = 'RELOADING';
                crosshair.classList.add('reloading');
                crosshairLines.setAttribute('stroke', '#f0f');
            } else {
                statusText.innerText = currentAmmo < 5 ? 'Low Ammo Warning' : 'Ammo Nominal';
                statusText.className = currentAmmo < 5 ? 'text-pink-400 text-[10px] tracking-[0.5em] mb-2 font-bold uppercase animate-pulse' : 'text-cyan-400 text-[10px] tracking-[0.5em] mb-2 font-bold uppercase';
                countText.innerText = `${currentAmmo} / ${MAX_AMMO}`;
                crosshair.classList.remove('reloading');
                crosshairLines.setAttribute('stroke', '#0ff');
            }

            for (let i = 0; i < MAX_AMMO; i++) {
                const pip = document.getElementById(`ammo-pip-${i}`);
                if (isReloading) {
                    pip.style.opacity = '0.2';
                    pip.style.backgroundColor = '#f0f';
                } else {
                    pip.style.opacity = i < currentAmmo ? '1' : '0.1';
                    pip.style.backgroundColor = currentAmmo < 5 ? '#f472b6' : '#22d3ee';
                }
            }
        }

        function reload() {
            if (isReloading) return;
            isReloading = true;
            updateAmmoUI();
            
            setTimeout(() => {
                currentAmmo = MAX_AMMO;
                isReloading = false;
                updateAmmoUI();
            }, RELOAD_TIME);
        }

        function setupControls() {
            const overlay = document.getElementById('overlay');
            const message = document.getElementById('message');
            
            overlay.addEventListener('click', () => {
                if (health <= 0) { location.reload(); return; }
                const now = performance.now();
                if (now - lastLockTime < LOCK_COOLDOWN) {
                    const remaining = Math.ceil((LOCK_COOLDOWN - (now - lastLockTime)) / 1000);
                    message.innerText = `SYSTEM STABILIZING... WAIT ${remaining}s`;
                    return;
                }
                try {
                    overlay.requestPointerLock();
                } catch (e) {
                    message.innerText = "LINK FAILED. CLICK AGAIN.";
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === overlay) {
                    gameActive = true;
                    overlay.style.display = 'none';
                } else {
                    gameActive = false;
                    lastLockTime = performance.now();
                    overlay.style.display = 'flex';
                    if (health > 0) message.innerText = 'LINK DISCONNECTED. RECONNECT?';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!gameActive) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            });

            const keys = { 'KeyW': 'forward', 'KeyS': 'backward', 'KeyA': 'left', 'KeyD': 'right' };
            document.addEventListener('keydown', (e) => { 
                if(keys[e.code]) moveState[keys[e.code]] = true; 
                if(e.code === 'KeyR' && currentAmmo < MAX_AMMO) reload();
            });
            document.addEventListener('keyup', (e) => { if(keys[e.code]) moveState[keys[e.code]] = false; });
            document.addEventListener('mousedown', () => { if(gameActive) shoot(); });
        }

        function shoot() {
            if (isReloading || currentAmmo <= 0) {
                if (currentAmmo <= 0) reload();
                return;
            }

            currentAmmo--;
            updateAmmoUI();

            const bulletGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const spawnPos = camera.position.clone();
            bullet.position.copy(spawnPos);
            
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bullet.userData.velocity = dir.multiplyScalar(1.8);
            bullet.userData.life = 60;

            shakeIntensity = 0.05;

            const flash = new THREE.PointLight(0x00ffff, 10, 10);
            flash.position.copy(spawnPos).add(dir.multiplyScalar(0.5));
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 40);

            scene.add(bullet);
            bullets.push(bullet);

            if (currentAmmo === 0) reload();
        }

        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 50 + Math.random() * 20;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const neonColors = [0xff00ff, 0x00ffff, 0xffff00, 0xff0055];
            const color = neonColors[Math.floor(Math.random() * neonColors.length)];

            const geometry = new THREE.IcosahedronGeometry(1.2, 0);
            const material = new THREE.MeshStandardMaterial({ 
                color: color, emissive: color, emissiveIntensity: 0.8, wireframe: true 
            });
            const enemy = new THREE.Mesh(geometry, material);
            
            enemy.position.set(x, 1 + Math.random() * 4, z);
            enemy.userData.color = color;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        function createExplosion(pos, color) {
            const particleColors = [color, 0xffffff, 0x00ffff];
            for(let i=0; i<25; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.12, 0.12, 0.12),
                    new THREE.MeshBasicMaterial({ color: particleColors[Math.floor(Math.random()*3)] })
                );
                p.position.copy(pos);
                p.userData.vel = new THREE.Vector3(
                    (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.8
                );
                p.userData.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                const delta = 0.04;
                velocity.x -= velocity.x * 0.15;
                velocity.z -= velocity.z * 0.15;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();

                if (moveState.forward || moveState.backward) velocity.z += direction.z * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * delta;

                camera.translateX(-velocity.x);
                camera.translateZ(-velocity.z);

                if (shakeIntensity > 0) {
                    camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                    camera.position.y += (Math.random() - 0.5) * shakeIntensity;
                    shakeIntensity *= 0.9;
                } else {
                    camera.position.y = 1.6 + Math.sin(Date.now() * 0.005) * 0.03;
                }

                const now = performance.now();
                if (now - lastEnemySpawn > Math.max(1200, 3000 - score/20)) {
                    spawnEnemy();
                    lastEnemySpawn = now;
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    b.position.add(b.userData.velocity);
                    if (--b.userData.life <= 0) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                        continue;
                    }

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (b.position.distanceTo(e.position) < 1.5) {
                            createExplosion(e.position, e.userData.color);
                            scene.remove(e);
                            enemies.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            score += 150;
                            document.getElementById('score').innerText = score.toString().padStart(5, '0');
                            break;
                        }
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    const toPlayer = new THREE.Vector3().subVectors(camera.position, e.position).normalize();
                    e.position.add(toPlayer.multiplyScalar(0.04 + score/100000));
                    e.rotation.x += 0.08; e.rotation.y += 0.08;

                    if (e.position.distanceTo(camera.position) < 1.8) {
                        takeDamage();
                        shakeIntensity = 0.3;
                        createExplosion(e.position, 0xff0000);
                        scene.remove(e);
                        enemies.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.position.add(p.userData.vel);
                    p.userData.life -= 0.02;
                    p.scale.setScalar(p.userData.life);
                    if (p.userData.life <= 0) {
                        scene.remove(p);
                        particles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function takeDamage() {
            health -= 15;
            const healthBar = document.getElementById('health-bar');
            healthBar.style.width = `${Math.max(0, health)}%`;
            document.getElementById('health-text').innerText = `${Math.max(0, health)}%`;
            
            const flash = document.getElementById('damage-overlay');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 150);

            if (health <= 0) {
                gameActive = false;
                document.exitPointerLock();
                const overlay = document.getElementById('overlay');
                overlay.style.display = 'flex';
                document.getElementById('message').innerHTML = `
                    <span class="text-pink-500 text-6xl font-black italic">SYSTEM CRASH</span><br>
                    <span class="text-white text-2xl mt-4 block underline">FINAL SCORE: ${score}</span><br>
                    CLICK TO REBOOT CORE
                `;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
